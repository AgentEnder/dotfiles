# tmux server config used ONLY by the `claude` wrapper (socket: -L claude).
# This server never reads ~/.tmux.conf, so your normal tmux setup and your
# polygraph-* sessions on the default socket are completely untouched.

# Prefix. C-b is Claude Code's own "background this command", and nesting a
# polygraph attach inside a wrapper pane would make both servers fight over it.
#   prefix  C-Space -> legacy NUL (0x00): every terminal sends it, works over ssh
#   prefix2 C-:     -> no legacy encoding exists, so nothing else can claim it,
#                      but it needs a terminal speaking the kitty keyboard
#                      protocol (Zed does; Terminal.app does not)
set -s extended-keys on
set -g prefix C-Space
set -g prefix2 C-:
bind C-Space send-prefix            # double-tap to send a literal C-Space through

set -g status off                   # no green bar — the pane IS the terminal
set -s escape-time 0                # Esc (interrupt Claude) must not lag ~500ms
set -s focus-events on
set -g mouse on                     # wheel scrolls Claude's output via copy-mode
set -g history-limit 200000
set -g set-clipboard on             # OSC 52 copies pass through to your terminal
set -g allow-passthrough on         # raw OSC/DCS from Claude (images, hyperlinks)
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"  # truecolor; without this Claude's palette flattens
set -g set-titles on
set -g set-titles-string "#{pane_title}"
set -g detach-on-destroy on         # claude exits -> client exits -> back in your shell
set -g renumber-windows on
